<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14283d" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657b8c"/></marker>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-weight:700;fill:#153b5c}.body{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#29465d}.muted{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#718494}.white{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#fff}.small{font-size:14px}.mid{font-size:16px}.label{font-size:18px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f5f8fb"/>
  <text x="50" y="52" class="title" font-size="30">CRM-DEMO｜图片识别商机报备</text>
  <text x="50" y="82" class="body" font-size="16">把工地照片、铭牌照片和项目资料转成可解释、可审核、可发布的商机报备草稿</text>
  <rect x="50" y="108" width="1500" height="52" rx="6" fill="#fff8e9" stroke="#ddb36d"/>
  <text x="75" y="140" class="body mid" font-weight="700">设计主线：图片是证据 → FactCandidate 是候选 → 销售确认后才创建/更新商机</text>

  <rect x="50" y="195" width="1500" height="254" rx="9" fill="#fff" stroke="#d4e0e8" filter="url(#shadow)"/>
  <text x="76" y="226" class="title label">一、从现场图片到候选事实</text>
  <g class="body">
    <rect x="78" y="256" width="220" height="150" rx="7" fill="#e8f2f8" stroke="#8fb4c9"/>
    <text x="188" y="287" text-anchor="middle" class="label" fill="#195b7d">现场输入</text><text x="98" y="321" class="small">工地照片</text><text x="98" y="346" class="small">铭牌照片</text><text x="98" y="371" class="small">项目资料 / PDF</text><text x="98" y="392" class="muted small">原图引用 + 权限</text>
    <rect x="341" y="256" width="220" height="150" rx="7" fill="#eaf6f4" stroke="#90c6ba"/>
    <text x="451" y="287" text-anchor="middle" class="label" fill="#1a6b5e">质量与解析</text><text x="361" y="321" class="small">清晰度 / 方向 / 去重</text><text x="361" y="346" class="small">OCR 文本框</text><text x="361" y="371" class="small">视觉与文档理解</text><text x="361" y="392" class="muted small">敏感信息脱敏</text>
    <rect x="604" y="256" width="250" height="150" rx="7" fill="#f0ecfa" stroke="#b8a9d9"/>
    <text x="729" y="287" text-anchor="middle" class="label" fill="#5a4a89">AI 识别字段</text><text x="624" y="321" class="small">项目名称 · 甲方</text><text x="624" y="346" class="small">地址 · 时间</text><text x="624" y="371" class="small">证据框 / 页码 / 置信度</text><text x="624" y="392" class="muted small">识别不到就输出 unknown</text>
    <rect x="897" y="256" width="250" height="150" rx="7" fill="#fff4e6" stroke="#e0b36e"/>
    <text x="1022" y="287" text-anchor="middle" class="label" fill="#9a6219">项目实体治理</text><text x="917" y="321" class="small">地址规范化与别名</text><text x="917" y="346" class="small">已有项目候选匹配</text><text x="917" y="371" class="small">冲突 / 重复 / 风险检测</text><text x="917" y="392" class="muted small">不直接写入 CRM</text>
    <rect x="1190" y="256" width="315" height="150" rx="7" fill="#173f68" stroke="#173f68"/>
    <text x="1347" y="287" text-anchor="middle" class="white label">FactCandidate</text><text x="1214" y="321" class="white small">字段 · 候选值 · 置信度</text><text x="1214" y="346" class="white small">图片框 / 页码 / 原文证据</text><text x="1214" y="371" class="white small">项目匹配与冲突状态</text><text x="1214" y="392" class="white small">PENDING_REVIEW</text>
  </g>
  <g stroke="#657b8c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 331 H341"/><path d="M561 331 H604"/><path d="M854 331 H897"/><path d="M1147 331 H1190"/></g>

  <rect x="50" y="482" width="1500" height="190" rx="9" fill="#fff" stroke="#d4e0e8" filter="url(#shadow)"/>
  <text x="76" y="513" class="title label">二、生成报备草稿并按风险治理</text>
  <rect x="78" y="540" width="420" height="102" rx="7" fill="#e8f6ee" stroke="#8fc6a5"/><text x="99" y="570" class="body label" fill="#216b42">低风险：自动生成草稿</text><text x="99" y="596" class="body small">摘要、来源标记、地址格式化</text><text x="99" y="620" class="body small">内部跟进任务草稿</text>
  <rect x="546" y="540" width="420" height="102" rx="7" fill="#fff6df" stroke="#dfb96a"/><text x="567" y="570" class="body label" fill="#8a5b16">中风险：销售确认</text><text x="567" y="596" class="body small">项目名称、甲方、地址、时间</text><text x="567" y="620" class="body small">关联已有项目或创建新项目</text>
  <rect x="1014" y="540" width="491" height="102" rx="7" fill="#fbe9e9" stroke="#d79a9a"/><text x="1035" y="570" class="body label" fill="#9a3e3e">高风险：复核或审批</text><text x="1035" y="596" class="body small">金额、合同承诺、敏感信息、批量更新</text><text x="1035" y="620" class="body small">多项目匹配或证据互相冲突</text>
  <path d="M1347 406 V515" stroke="#657b8c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="705" width="1500" height="126" rx="9" fill="#fff" stroke="#d4e0e8" filter="url(#shadow)"/><text x="76" y="736" class="title label">三、发布商机报备与反馈闭环</text>
  <g class="body"><rect x="78" y="756" width="270" height="50" rx="6" fill="#eef4f8" stroke="#a9bfd0"/><text x="213" y="787" text-anchor="middle" class="small">Project / Opportunity</text><rect x="374" y="756" width="270" height="50" rx="6" fill="#eef4f8" stroke="#a9bfd0"/><text x="509" y="787" text-anchor="middle" class="small">商机报备信息</text><rect x="670" y="756" width="270" height="50" rx="6" fill="#eef4f8" stroke="#a9bfd0"/><text x="805" y="787" text-anchor="middle" class="small">下一步任务 / 事件</text><rect x="966" y="756" width="240" height="50" rx="6" fill="#eef4f8" stroke="#a9bfd0"/><text x="1086" y="787" text-anchor="middle" class="small">证据与审计日志</text><rect x="1232" y="756" width="273" height="50" rx="6" fill="#eaf6f4" stroke="#90c6ba"/><text x="1368" y="787" text-anchor="middle" class="small">销售修正 → 规则优化</text></g>
  <path d="M78 856 H1505" stroke="#b7c8d5" stroke-width="1.5"/><text x="800" y="881" class="muted" text-anchor="middle" font-size="12">复用 FactCandidate、质量评分、冲突检测、审核服务与本体同步能力｜2026-10-14</text>
</svg>
