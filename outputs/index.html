  <div class="modal-backdrop" id="modal"><div class="modal"><h2>新建商机</h2><div class="form-grid"><div class="field full"><label>商机名称</label><input id="fName" placeholder="例如：华东区域数字化营销项目" /></div><div class="field"><label>关联客户</label><input id="fCustomer" placeholder="客户名称" /></div><div class="field"><label>预计金额</label><input id="fAmount" placeholder="¥ 0" /></div><div class="field"><label>业务类型</label><select id="fType"><option>CRM通用</option><option>制造业</option><option>零售行业</option></select></div><div class="field"><label>当前阶段</label><select id="fStage"><option>商机报备</option><option>商机确认</option><option>商机跟踪</option><option>标前引导</option><option>招投标</option><option>签约</option></select></div></div><div class="modal-actions"><button class="secondary" id="closeModal">取消</button><button class="primary" id="saveOpp">保存商机</button></div></div></div>
  <div class="modal-backdrop" id="semanticModal"><div class="modal"><h2>新建语义资产</h2><div class="form-grid"><div class="field"><label>语义分类</label><select id="sCategory"><option>实体</option><option>关系与图谱</option><option>术语与别名</option><option>业务动作</option><option>业务事件</option><option>业务规则</option><option>流程与 SOP</option><option>指标</option><option>维度</option><option>目标与阈值</option><option>分析模型</option><option>归因因果</option><option>业务策略</option></select></div><div class="field"><label>资产类型</label><input id="sType" placeholder="例如：行业指标" /></div><div class="field full"><label>资产名称</label><input id="sName" placeholder="例如：客户年度出货目标" /></div><div class="field full"><label>业务定义</label><input id="sDesc" placeholder="描述它代表什么业务事实或规则" /></div></div><div class="modal-actions"><button class="secondary" id="closeSemanticModal">取消</button><button class="primary" id="saveSemantic">保存到数据库</button></div></div></div>
  <div class="modal-backdrop" id="stageModal"><div class="modal"><h2 id="stageModalTitle">转换客户开发阶段</h2><p id="stageModalHint" class="subtle"></p><div id="stageFields" class="form-grid"></div><div class="modal-actions"><button class="secondary" onclick="closeStageModal()">取消</button><button class="primary" onclick="submitStage()">校验并转换</button></div></div></div>
  <div class="modal-backdrop" id="opportunityStageModal"><div class="modal"><h2 id="opportunityStageTitle">推进商机阶段</h2><p id="opportunityStageHint" class="subtle"></p><div id="opportunityStageFields" class="form-grid"></div><div class="modal-actions"><button class="secondary" onclick="closeOpportunityStageModal()">取消</button><button class="primary" onclick="submitOpportunityStage()">校验并推进</button></div></div></div>
  <div class="modal-backdrop" id="discoveryModal"><div class="modal discovery-modal"><h2>现场发现商机</h2><p class="subtle">上传工程现场证据，先生成候选草稿，再查重并由销售确认。</p><div class="discovery-upload">支持工程概况牌、现场照片或项目文件<input id="discoveryFile" type="file" accept="image/*,.pdf,.doc,.docx,.txt" /></div><div class="discovery-grid" style="margin-top:12px"><div class="field"><label>项目名称（可选）</label><input id="dProject" placeholder="识别不到时可手动补充" /></div><div class="field"><label>客户 / 建设单位（可选）</label><input id="dCustomer" placeholder="例如：华东建材集团" /></div><div class="field"><label>项目地址（可选）</label><input id="dAddress" placeholder="省市、园区或详细地址" /></div><div class="field"><label>产品线（可选）</label><input id="dProducts" placeholder="外墙涂料,保温" /></div></div><div class="field" style="margin-top:10px"><label>现场描述 / OCR 草稿</label><input id="dNotes" placeholder="MVP 中作为识别适配层输入，后续可替换为真实 OCR / 视觉模型" /></div><div id="discoveryResult" class="discovery-result"></div><div class="discovery-actions"><button class="secondary" id="closeDiscovery">取消</button><button class="secondary" id="checkDiscovery" style="display:none">查重</button><button class="primary" id="saveDiscovery">识别并生成草稿</button><button class="primary" id="confirmDiscovery" style="display:none">确认并创建商机</button></div></div></div>
  <script>
    const API_BASE=window.CRM_API_BASE||(location.protocol==='file:'?'http://127.0.0.1:8877':'');
    const nativeFetch=window.fetch.bind(window);window.fetch=(url,options)=>nativeFetch(typeof url==='string'&&url.startsWith('/api/')?API_BASE+url:url,options);
    let opps=[], current=null, activeStage='全部', opportunityStages=[], pendingOpportunityStage=null;
    const money=(n)=>`¥ ${Number(n||0).toLocaleString('zh-CN')}`;
    const toast=(msg)=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
    function renderStageCounts(){const btn=document.querySelector('.stage');if(btn)btn.querySelector('b').textContent=opps.length}
    function renderList(){const el=document.getElementById('opps');const rows=opps;el.innerHTML=rows.length?rows.map(x=>`<button class="opp" data-id="${x.id}"><div class="opp-main"><div class="opp-name">${x.name}</div><div>${x.tags.map((t,i)=>`<span class="tag ${i?'blue':''}">${t}</span>`).join('')}</div><div class="opp-desc">${x.description}</div><div class="opp-meta"><span>客户 · ${x.customer}</span><span>负责人 · ${x.owner}</span><span>${x.stage}</span></div></div><div class="opp-value">${money(x.amount)}<small>${x.business_type||x.businessType}</small></div></button>`).join(''):`<div class="empty">暂无商机</div>`;renderStageCounts();document.querySelectorAll('.opp').forEach(btn=>btn.onclick=()=>openOpportunity360(Number(btn.dataset.id)))}
    function opportunityListId(x,index){return `S${String(x.id||index+1).padStart(6,'0')}`}
    function opportunityListMetrics(){const active=opps.filter(x=>x.stage!=='签约');const signed=opps.filter(x=>x.stage==='签约');const amount=active.reduce((sum,x)=>sum+Number(x.amount||0),0);const weighted=active.reduce((sum,x)=>sum+Number(x.amount||0)*({'商机报备':.2,'商机确认':.35,'商机跟踪':.5,'标前引导':.65,'招投标':.8}[x.stage]||.2),0);return {total:opps.length,active:active.length,signed:signed.length,amount,weighted,review:opps.filter(x=>x.stage==='商机确认').length,focus:opps.filter(x=>Number(x.amount||0)>=1000000).length,priority:opps.filter(x=>x.stage==='招投标'||x.stage==='标前引导').length}}
    function showOpportunityList(){const m=opportunityListMetrics();document.querySelector('.content').innerHTML=`<div class="opportunity-list-page"><div class="page-head"><div><h1>商机</h1><p>集中查看全部商机，点击单条记录进入阶段推进详情。</p></div><div style="display:flex;gap:8px"><button class="secondary" id="discoveryBtn">⌁ 现场发现</button><button class="primary" id="newOpp">＋ 新建商机</button></div></div><section class="opportunity-list-kpis"><div class="opportunity-list-kpi"><label>商机总数</label><strong>${m.total}</strong><span>在途 ${m.active} 条 · 赢单 ${m.signed} 条</span></div><div class="opportunity-list-kpi"><label>在途商机金额</label><strong>${money(m.amount)}</strong><span>当前全部开放商机金额</span></div><div class="opportunity-list-kpi"><label>加权金额</label><strong>${money(m.weighted)}</strong><span>按销售阶段概率估算</span></div><div class="opportunity-list-kpi"><label>重点项目</label><strong>${m.focus}</strong><span>预计金额 ≥ 100 万</span></div></section><section class="opportunity-list-kpis"><div class="opportunity-list-kpi"><label>待审核</label><strong>${m.review}</strong><span>当前处于商机确认</span></div><div class="opportunity-list-kpi"><label>标前及招投标</label><strong>${m.priority}</strong><span>需要重点推进</span></div><div class="opportunity-list-kpi"><label>赢单金额</label><strong>${money(m.signed?opps.filter(x=>x.stage==='签约').reduce((sum,x)=>sum+Number(x.amount||0),0):0)}</strong><span>已进入签约阶段</span></div><div class="opportunity-list-kpi"><label>风险商机</label><strong>${opps.filter(x=>x.risk).length}</strong><span>存在待处理风险</span></div></section><section class="opportunity-table-panel"><div class="opportunity-table-toolbar"><div><strong>全部商机</strong><span style="margin-left:8px">共 ${opps.length} 条数据</span></div><div><button class="tool">☷ 表头设置</button></div></div><div class="opportunity-table-wrap"><table class="opportunity-table"><thead><tr><th>商机号</th><th>商机描述</th><th>客户</th><th>预计金额</th><th>项目节点</th><th>项目等级</th><th>负责人</th></tr></thead><tbody id="opportunityRows"></tbody></table></div></section></div>`;bindListActions();renderOpportunityTable()}
    function renderOpportunityTable(){const el=document.getElementById('opportunityRows');if(!el)return;el.innerHTML=opps.length?opps.map((x,index)=>`<tr data-id="${x.id}"><td>${opportunityListId(x,index)}</td><td><span class="opportunity-table-title">${x.name}</span><span class="opportunity-table-desc">${x.description||'暂无商机描述'}</span></td><td>${x.customer}</td><td><span class="opportunity-table-amount">${money(x.amount)}</span></td><td><span class="opportunity-table-stage">${x.stage}</span></td><td><span class="opportunity-table-level">${Number(x.amount||0)>=1000000?'重点项目':'普通项目'}</span></td><td>${x.owner}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">暂无商机</div></td></tr>`;el.querySelectorAll('tr[data-id]').forEach(row=>row.onclick=()=>openOpportunity360(Number(row.dataset.id)))}

      {category:'分析模型',type:'分析模型',name:'涂料客户增长潜力模型',desc:'综合采购金额、项目数量、关系覆盖、产品渗透和年度目标，识别增购与交叉销售机会。',badges:['Model','Scoring'],fields:[['输入变量','feature','采购金额、签约项目数、产品渗透率、市占率','统一从指标和关系语义读取。'],['输出结果','score','增长潜力 A / B / C','供客户开发 Agent 排序行动。'],['解释方式','explain','按贡献因子生成解释','每次推荐保留依据。']]},
      {category:'归因因果',type:'归因图谱',name:'采购金额增长归因',desc:'拆解客户采购金额增长来自新项目、增购、价格变化、产品组合和区域市场变化的贡献。',badges:['Causal','归因'],fields:[['目标指标','metric','采购金额','归因结果回写经营分析。'],['贡献因子','factor','新项目 / 增购 / 价格 / 产品组合 / 区域','支持按客户和产品体系分析。'],['关系方向','direction','正向贡献 / 负向拖累','用于生成经营建议。']]},
      {category:'业务策略',type:'业务策略',name:'高潜工程客户增购策略',desc:'针对年度采购金额高、项目储备充足但产品渗透不足的客户，制定产品组合和关键人突破策略。',badges:['Strategy','Agent'],fields:[['触发条件','rule','增长潜力 A + 产品渗透率 < 40%','触发策略推荐。'],['推荐动作','action','安排技术交流、推进样板验证、引入防水产品','生成客户行动计划。'],['预期结果','metric','新增签约项目数、出货金额','持续回写指标与客户评分。']]}
    ];
    let activeAsset=semanticAssets[0], activeSemanticTab='实体';
    function openSemanticModal(){document.getElementById('semanticModal').classList.add('show')}
    function renderSemantic(){const visible=semanticAssets.filter(x=>x.category===activeSemanticTab);if(!visible.some(x=>x.name===activeAsset.name))activeAsset=visible[0]||semanticAssets[0];document.querySelector('.content').innerHTML=`<div class="page-head"><div><h1>语义管理</h1><p>统一定义涂料行业的对象、术语、规则和业务动作，让 Agent 理解并执行真实业务。</p></div><div style="display:flex;gap:8px"><button class="secondary" onclick="location.reload()">← 返回商机</button><button class="primary" onclick="openSemanticModal()">＋ 新建语义资产</button></div></div><div class="semantic-page"><div class="semantic-toolbar"><strong>涂料行业语义浏览</strong><select><option>AI草取版</option><option>企业标准版</option></select><select><option>涂料行业</option><option>建筑材料</option><option>CRM通用</option></select><input placeholder="搜索语义、别名、口径或规则" /></div><div class="semantic-tabs">${['实体','关系与图谱','术语与别名','业务动作','业务事件','业务规则','流程与 SOP','指标','维度','目标与阈值','分析模型','归因因果','业务策略'].map(t=>`<button class="semantic-tab ${activeSemanticTab===t?'active':''}" onclick="activeSemanticTab='${t}';renderSemantic()">${t}</button>`).join('')}</div><div class="semantic-body"><div class="asset-list"><div class="asset-list-head"><span>${activeSemanticTab} · ${visible.length} 项</span><span>筛选 ↕</span></div>${visible.map(x=>`<button class="asset-card ${activeAsset.name===x.name?'active':''}" onclick="activeAsset=semanticAssets.find(a=>a.name==='${x.name}');renderSemantic()"><span class="asset-type">${x.type}</span><h4>${x.name}</h4><p>${x.desc}</p></button>`).join('')}</div><div class="asset-detail"><div class="asset-head"><div><div class="detail-kicker">语义资产 · ${activeAsset.type}</div><h2>${activeAsset.name}</h2><p>涂料行业 · 统一定义业务含义、边界和可执行规则</p></div><div class="asset-badges">${activeAsset.badges.map((b,i)=>`<span class="badge ${i?'teal':''}">${b}</span>`).join('')}</div></div><div class="definition">${activeAsset.desc}<br/><strong>语义边界：</strong>该资产必须关联客户、产品或交付事实，并按涂料行业口径解释；缺少关键字段时，Agent 只能给出待确认建议。</div><div class="section-row"><h3>属性与业务口径</h3><span class="tag orange">${activeAsset.fields.length} 个字段</span></div><table class="semantic-table"><thead><tr><th>属性名称</th><th>类型</th><th>枚举值 / 单位</th><th>属性说明</th></tr></thead><tbody>${activeAsset.fields.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td></tr>`).join('')}</tbody></table><div class="semantic-bottom"><div class="semantic-mini"><h4>关联关系与行业别名</h4><div class="mini-row"><span>同义词 / 别名</span><b>${activeAsset.category==='指标'?'采购额 · 销售额 · 出货收入':'涂料行业业务术语 · CRM 对象 · Agent 语义'}</b></div><div class="mini-row"><span>关系路径</span><b>客户 → 商机 → 产品体系 → 合同 → 出货</b></div></div><div class="semantic-mini"><h4>治理与使用情况</h4><div class="mini-row"><span>语义覆盖率</span><b>100%</b></div><div class="mini-row"><span>近 30 天调用</span><b>${activeAsset.category==='指标'?'458':'128'} 次</b></div></div></div></div></div></div>`}
    document.querySelectorAll('.stage').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.stage').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeStage=btn.dataset.stage;renderList()});
    document.getElementById('semanticNav').onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('semanticNav').classList.add('active');renderSemantic()};
    document.getElementById('agentNav').onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('agentNav').classList.add('active');renderAgentStudio()};
    document.getElementById('closeSemanticModal').onclick=()=>document.getElementById('semanticModal').classList.remove('show');
    document.getElementById('saveSemantic').onclick=async()=>{const category=document.getElementById('sCategory').value,name=document.getElementById('sName').value.trim(),description=document.getElementById('sDesc').value.trim();if(!name||!description)return toast('请填写资产名称和业务定义');const asset={category,assetType:document.getElementById('sType').value||category,name,description,badges:['新增资产','涂料行业'],fields:[['业务定义','text','—',description],['所属分类','enum',category,'用于语义检索、治理和 Agent 调用。']]};try{const res=await fetch('/api/semantic-assets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(asset)});if(!res.ok)throw new Error('保存失败');const saved=await res.json();semanticAssets.unshift({...saved,type:saved.assetType||category});activeSemanticTab=category;activeAsset=semanticAssets[0];document.getElementById('semanticModal').classList.remove('show');renderSemantic();toast('语义资产已写入 SQLite') }catch(error){toast('后台未连接，语义资产保存失败')}};
    function renderCustomer360(){renderCustomer();const stageTrack=document.querySelector('.at-track');if(stageTrack){const stageCard=stageTrack.closest('.card');if(stageCard)stageCard.remove()}document.querySelectorAll('.customer-section').forEach(section=>{if(section.querySelector('h2')?.textContent==='下一步行动')section.remove()})}
    document.getElementById('customerNav').onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('customerNav').classList.add('active');renderCustomer360()};
    document.getElementById('customerDevNav').onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('customerDevNav').classList.add('active');renderCustomerDevelopment()};
    document.getElementById('opportunityNav').onclick=()=>{location.reload()};
    document.getElementById('progressOpp').onclick=openOpportunityStageModal;
    document.getElementById('discoveryBtn').onclick=()=>{resetDiscovery();document.getElementById('discoveryModal').classList.add('show')};
    document.getElementById('closeDiscovery').onclick=()=>{document.getElementById('discoveryModal').classList.remove('show');resetDiscovery()};
    document.getElementById('saveDiscovery').onclick=createDiscoveryDraft;
    document.getElementById('checkDiscovery').onclick=checkDiscovery;
    document.getElementById('confirmDiscovery').onclick=confirmDiscovery;
    document.getElementById('newOpp').onclick=()=>document.getElementById('modal').classList.add('show');document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('saveOpp').onclick=async()=>{const payload={name:document.getElementById('fName').value.trim()||'新建商机',customer:document.getElementById('fCustomer').value||'待关联客户',stage:document.getElementById('fStage').value,amount:Number((document.getElementById('fAmount').value||'0').replace(/[^0-9]/g,'')),businessType:document.getElementById('fType').value,owner:'李盛云',tags:['新建对象']};const res=await fetch('/api/opportunities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)return toast('保存失败，请检查后台服务');const saved=await res.json();opps.unshift(saved);document.getElementById('modal').classList.remove('show');await openOpportunity360(saved.id);toast('商机已写入 SQLite，已生成语义对象')};
    async function recordEvent(eventType,message){const res=await fetch(`/api/opportunities/${current.id}/events`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventType,message})});toast(res.ok?`${message}，已写入业务事件`:'事件写入失败')}
    async function loadData(){await loadOpportunityStages();const res=await fetch('/api/opportunities');opps=await res.json();current=null;showOpportunityList()}
    loadData().catch(()=>{document.getElementById('opps').innerHTML='<div class="empty">后台未启动，请运行 python server.py</div>'});
  </script>
</body>
